<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Verifica tu cuenta de Digiverso</title>
  </head>
  <body>
    <h1>Verifica tu cuenta de Digiverso</h1>
    <p>Hola {{nombre}},</p>
    <p>Confirma tu correo electrónico para activar tu cuenta y comenzar a operar en Digiverso.</p>
    <p><a href="{{url}}">Verificar mi correo</a></p>
    <p>Este enlace es de uso único y vence en {{minutos}} minutos.</p>
    <p>Si no solicitaste esta cuenta, puedes ignorar este mensaje.</p>
  </body>
</html>
